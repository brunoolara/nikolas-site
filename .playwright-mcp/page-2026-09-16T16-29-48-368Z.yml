              - paragraph [ref=e172]: Entre os destaques mais tradicionais da casa estão o feijão tropeiro, a salada de berinjela, a dobradinha, o chope e o nosso viradão à mineira — pratos que fazem parte da nossa história desde 1977. E história é o que não falta por aqui!
